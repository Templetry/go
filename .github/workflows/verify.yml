name: Verify forms

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so upstream drift surfaces here and not in a user project.
    - cron: "0 6 * * 1"

permissions:
  # Render and build only; nothing here writes to the repository.
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  form:
    name: ${{ matrix.form }} (default)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        form: [cli, http-service, rest-sqlite]
    steps:
      - uses: actions/checkout@v4
      - uses: Templetry/.github/actions/setup-templetry@main
      - name: Render
        run: |
          templetry render --template "./${{ matrix.form }}" --out "$RUNNER_TEMP/out" \
            --set "project_name=Verify App" --set "module_path=github.com/verify/app"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build and test rendered output
        working-directory: ${{ runner.temp }}/out
        run: |
          go build ./...
          go test ./...

  piece:
    name: ${{ matrix.case.form }} + ${{ matrix.case.piece }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case:
          - { form: http-service, piece: version-endpoint, args: "--set version_value=1.2.3" }
          - { form: rest-sqlite, piece: crud-resource, args: "--set entity=Product" }
    steps:
      - uses: actions/checkout@v4
      - uses: Templetry/.github/actions/setup-templetry@main
      - name: Render and adopt the piece
        run: |
          templetry render --template "./${{ matrix.case.form }}" --out "$RUNNER_TEMP/out" \
            --set "project_name=Verify App" --set "module_path=github.com/verify/app"
          templetry add "${{ matrix.case.piece }}" "$RUNNER_TEMP/out" \
            --template "./${{ matrix.case.form }}" ${{ matrix.case.args }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build and test augmented output
        working-directory: ${{ runner.temp }}/out
        run: |
          go build ./...
          go test ./...
