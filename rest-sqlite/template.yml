schema_version: 1
name: go-rest-sqlite
description: REST API over SQLite — pure-Go driver (no CGO), migrations at startup, repository layer, httptest suite
kinds: [backend, database]
languages: [go]
frameworks: [sqlite]

variables:
  - key: project_name
    label: Project name
    type: string
    pattern: "^[A-Za-z][A-Za-z0-9 ]*$"
  - key: module_path
    label: Go module path
    type: string
    pattern: "^[a-z0-9]+(\\.[a-z0-9-]+)*(/[A-Za-z0-9._~-]+)+$"

identity:
  - from: "example.com/template-app"   # module path in go.mod and imports
    to: "{module_path}"
  - from: "TemplateApp"                # docs
    to: "{project_name.pascal}"
  - from: "template-app"               # service name, db file, docker tag
    to: "{project_name.kebab}"

features:
  - key: environments
    label: development / staging / production profiles (ADR-0018)
    default: true
    files:
      - "internal/config/**"
      - ".env.development"
      - ".env.staging"
      - ".env.production"

  - key: docker
    label: Dockerfile (multi-stage, distroless)
    default: true
    files: ["Dockerfile", ".dockerignore"]
  - key: github_actions
    label: GitHub Actions CI
    default: true
    files: [".github/**"]

presets:
  - key: minimal
    label: Single configuration, no Docker
    features: {environments: false, docker: false}

verify:
  image: golang:1.26
  run: go build ./... && go test ./...
