schema_version: 1
name: go-http-service
description: Go HTTP service — stdlib mux (1.22 patterns), health endpoint, httptest suite
kinds: [backend]
languages: [go]

variables:
  - key: project_name
    label: Project name
    type: string
    pattern: "^[A-Za-z][A-Za-z0-9 ]*$"
  - key: module_path
    label: Go module path
    type: string
    pattern: "^[a-z0-9]+(\\.[a-z0-9-]+)*(/[A-Za-z0-9._~-]+)+$"

identity:
  - from: "example.com/template-app"   # module path in go.mod and imports
    to: "{module_path}"
  - from: "TemplateApp"                # docs
    to: "{project_name.pascal}"
  - from: "template-app"               # service name, docker tag
    to: "{project_name.kebab}"

features:
  - key: docker
    label: Dockerfile (multi-stage, distroless)
    default: true
    files: ["Dockerfile", ".dockerignore"]
  - key: github_actions
    label: GitHub Actions CI
    default: true
    files: [".github/**"]

verify:
  image: golang:1.26
  run: go build ./... && go test ./...
